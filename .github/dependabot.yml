# Keeps the actions in .github/workflows up to date: at most one grouped pull
# request a week, for releases at least a week old. The Rust crates are
# updated by hand (`cargo update`): Cargo.lock also sets Bazel's crates
# (MODULE.bazel), so an update needs MODULE.bazel.lock refreshed with it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
