# The crates the difftests (difftest/, built with Bazel) use: the mln-rs
# crates under test, all from one release, and the third-party crates the
# tests use directly. Cargo only resolves and locks them: MODULE.bazel reads
# this file and Cargo.lock into @next_crates. To test another release,
# change every mln-rs-* entry below (`=<version>` from crates.io, or a git
# commit of maplibre-native-next) and run `just update`.
[package]
name = "mln-rs-difftests"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "lib.rs"

[dependencies]
# v0.0.9 (louwers/maplibre-native-next@217beda), from git until crates.io
# has every crate of it.
mln-rs-actor = { git = "https://github.com/louwers/maplibre-native-next", rev = "217beda01707f2d9e0543f7e38ade57bd8fe3cc7" }
mln-rs-cheap-ruler = { git = "https://github.com/louwers/maplibre-native-next", rev = "217beda01707f2d9e0543f7e38ade57bd8fe3cc7" }
mln-rs-conversion = { git = "https://github.com/louwers/maplibre-native-next", rev = "217beda01707f2d9e0543f7e38ade57bd8fe3cc7" }
mln-rs-csscolorparser = { git = "https://github.com/louwers/maplibre-native-next", rev = "217beda01707f2d9e0543f7e38ade57bd8fe3cc7" }
mln-rs-earcut = { git = "https://github.com/louwers/maplibre-native-next", rev = "217beda01707f2d9e0543f7e38ade57bd8fe3cc7" }
mln-rs-earcut-test-fixtures = { git = "https://github.com/louwers/maplibre-native-next", rev = "217beda01707f2d9e0543f7e38ade57bd8fe3cc7" }
mln-rs-expression = { git = "https://github.com/louwers/maplibre-native-next", rev = "217beda01707f2d9e0543f7e38ade57bd8fe3cc7" }
mln-rs-feature = { git = "https://github.com/louwers/maplibre-native-next", rev = "217beda01707f2d9e0543f7e38ade57bd8fe3cc7" }
mln-rs-geojson = { git = "https://github.com/louwers/maplibre-native-next", rev = "217beda01707f2d9e0543f7e38ade57bd8fe3cc7" }
mln-rs-geojson-vt = { git = "https://github.com/louwers/maplibre-native-next", rev = "217beda01707f2d9e0543f7e38ade57bd8fe3cc7" }
mln-rs-geometry = { git = "https://github.com/louwers/maplibre-native-next", rev = "217beda01707f2d9e0543f7e38ade57bd8fe3cc7" }
mln-rs-gfx = { git = "https://github.com/louwers/maplibre-native-next", rev = "217beda01707f2d9e0543f7e38ade57bd8fe3cc7" }
mln-rs-kdbush = { git = "https://github.com/louwers/maplibre-native-next", rev = "217beda01707f2d9e0543f7e38ade57bd8fe3cc7" }
mln-rs-libstdcxx = { git = "https://github.com/louwers/maplibre-native-next", rev = "217beda01707f2d9e0543f7e38ade57bd8fe3cc7" }
mln-rs-map = { git = "https://github.com/louwers/maplibre-native-next", rev = "217beda01707f2d9e0543f7e38ade57bd8fe3cc7" }
mln-rs-map-types = { git = "https://github.com/louwers/maplibre-native-next", rev = "217beda01707f2d9e0543f7e38ade57bd8fe3cc7" }
mln-rs-math = { git = "https://github.com/louwers/maplibre-native-next", rev = "217beda01707f2d9e0543f7e38ade57bd8fe3cc7" }
mln-rs-nunicode = { git = "https://github.com/louwers/maplibre-native-next", rev = "217beda01707f2d9e0543f7e38ade57bd8fe3cc7" }
mln-rs-pixelmatch = { git = "https://github.com/louwers/maplibre-native-next", rev = "217beda01707f2d9e0543f7e38ade57bd8fe3cc7" }
mln-rs-polylabel = { git = "https://github.com/louwers/maplibre-native-next", rev = "217beda01707f2d9e0543f7e38ade57bd8fe3cc7" }
mln-rs-protozero = { git = "https://github.com/louwers/maplibre-native-next", rev = "217beda01707f2d9e0543f7e38ade57bd8fe3cc7" }
mln-rs-rapidjson = { git = "https://github.com/louwers/maplibre-native-next", rev = "217beda01707f2d9e0543f7e38ade57bd8fe3cc7" }
mln-rs-render-test = { git = "https://github.com/louwers/maplibre-native-next", rev = "217beda01707f2d9e0543f7e38ade57bd8fe3cc7" }
mln-rs-renderer = { git = "https://github.com/louwers/maplibre-native-next", rev = "217beda01707f2d9e0543f7e38ade57bd8fe3cc7" }
