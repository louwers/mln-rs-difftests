mln-rs-style = { git = "https://github.com/louwers/maplibre-native-next", rev = "217beda01707f2d9e0543f7e38ade57bd8fe3cc7" }
mln-rs-style-codegen = { git = "https://github.com/louwers/maplibre-native-next", rev = "217beda01707f2d9e0543f7e38ade57bd8fe3cc7" }
mln-rs-style-types = { git = "https://github.com/louwers/maplibre-native-next", rev = "217beda01707f2d9e0543f7e38ade57bd8fe3cc7" }
mln-rs-supercluster = { git = "https://github.com/louwers/maplibre-native-next", rev = "217beda01707f2d9e0543f7e38ade57bd8fe3cc7" }
mln-rs-text = { git = "https://github.com/louwers/maplibre-native-next", rev = "217beda01707f2d9e0543f7e38ade57bd8fe3cc7" }
mln-rs-tile = { git = "https://github.com/louwers/maplibre-native-next", rev = "217beda01707f2d9e0543f7e38ade57bd8fe3cc7" }
mln-rs-tile-id = { git = "https://github.com/louwers/maplibre-native-next", rev = "217beda01707f2d9e0543f7e38ade57bd8fe3cc7" }
